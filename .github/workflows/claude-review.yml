# PR 을 검토한다. 필수 상태 검사가 아니므로 이 워크플로가 실패해도 병합을 막지 않는다.
# 지적을 지키는 것은 당분간 합의로 두고, 반복해서 옳았던 범주만 나중에 CI 실패 조건으로 올린다.
#
# 구독 토큰을 쓰므로 API 과금이 없다. 포크에서 온 PR 에는 시크릿이 전달되지 않아 건너뛴다.

name: Claude Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# 연속으로 push 하면 이전 리뷰를 취소한다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # 액션이 GitHub 토큰을 OIDC 로 교환한다. 없으면 시작조차 하지 못한다.
  id-token: write

jobs:
  review:
    name: 리뷰
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # secrets 컨텍스트는 if 에서 쓸 수 없다. 존재 여부만 env 로 옮겨 판정한다.
    env:
      HAS_GENTASK_TOKEN: ${{ secrets.GENTASK_TOKEN != '' }}
      # doc 명령은 프로젝트 문맥을 요구한다. `project use` 는 디렉터리에 매여 저장되므로
      # 매번 새로 만들어지는 러너에는 맞지 않는다. 식별자이지 자격 증명이 아니라 평문으로 둔다.
      GENTASK_PROJECT: 9G5xhlf0c_6t
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.fork == false)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude'))
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 백로그와 문서의 원본은 운영 서버다. 토큰이 없으면 이 단계를 건너뛰고
      # 저장소 안의 것만 보고 검토한다.
      - name: gentask CLI 를 설치한다
        if: env.HAS_GENTASK_TOKEN == 'true'
        run: |
          npm i -g gentask@latest
          printf '%s' "$GENTASK_TOKEN" | gentask auth login
        env:
          GENTASK_TOKEN: ${{ secrets.GENTASK_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          track_progress: true
          prompt: |
            이 PR 의 변경분을 검토한다.

            ## 먼저 읽을 것

            저장소 루트의 `AGENTS.md` 를 읽는다. 개발 워크플로우와 마이그레이션 규약,
            수정하면 안 되는 대상이 거기 있다.

            `gentask` 명령이 설치되어 있으면 다음을 읽는다. 실패하면 문서 없이 진행한다.

                gentask doc show a2db36b6      # 작성 지침
                gentask doc show 3063f084      # 교정 사례
                gentask doc folder list        # 아키텍처 문서의 위치

            변경된 코드가 특정 모듈에 속하면 그 모듈의 아키텍처 문서와 결정 기록을
            `gentask doc list` 로 찾아 읽고, 코드가 그 결정을 벗어나지 않는지 본다.

            ## 이전 리뷰를 이어받는다

            이 PR 에 이전 리뷰가 있으면 먼저 읽는다. 백지에서 다시 보지 않는다.
            지난번 지적 중 무엇이 반영되었고 무엇이 남았는지 밝히고, 남은 것만 다시 든다.
            이미 반영된 지적을 되풀이하지 않는다.

            ## 무엇을 보는가

            1. **결함** — 실제로 틀린 동작. 재현 조건과 함께 적는다
            2. **아키텍처 이탈** — 문서에 적힌 결정과 어긋나는 구현. 어느 문서의 어느 대목인지 밝힌다
            3. **문체** — 문서와 주석이 `작성 지침` 을 벗어나는 곳. 특히 삭제해야 할 사족
            4. **테스트** — 바뀐 동작을 붙드는 테스트가 없는 곳

            ## 어떻게 적는가

            - 확실한 것만 든다. 추측이면 추측이라고 밝힌다
            - 근거를 파일과 줄로 가리킨다
            - 지적이 없으면 없다고 한 줄로 적는다. 채우기 위해 만들어 내지 않는다
            - 문체는 `작성 지침` 의 종결 어미 규격을 따른다. 리뷰 본문은 합니다체다
          claude_args: |
            --allowedTools Read,Grep,Glob,Bash(gentask:*),Bash(git:*)
