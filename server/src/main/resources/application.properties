spring.application.name=gentask

# 환경마다 다른 값과 자격 증명은 이 파일이 갖지 않는다. 키 목록과 로컬 값은 `.env.example` 에 있고
# 실제 값은 추적되지 않는 `.env` 가 갖는다.
#
# 로컬은 이 import 가 `server/.env` 를 읽고, 운영은 docker compose 가 서버의 `.env` 를 컨테이너
# 환경변수로 넣는다. 둘의 키 이름이 같아 주입 경로만 다르고 설정은 한 벌이다.
#
# `optional:` 이라 파일이 없어도 기동을 막지 않는다. 값이 없으면 그것을 쓰는 자리에서 실패한다.
# 기본값을 두지 않는 것은, 두면 운영에서 빠뜨려도 로컬 값으로 조용히 뜨기 때문이다.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 세션과 토큰 해시의 키. 32자 미만이면 기동이 실패한다.
auth.secret=${AUTH_SECRET}
auth.session.ttl=P30D
auth.session.absolute-ttl=P90D
auth.session.touch-interval=PT1H
auth.session.cookie-name=session_token
auth.session.cookie-secure=${AUTH_COOKIE_SECURE:false}

# 파일 보관소. 로컬은 compose.yaml 의 MinIO 이고 운영은 R2 다.
# 브라우저가 presigned URL 로 직접 접근하므로 endpoint 는 브라우저에서 닿는 주소여야 한다.
storage.endpoint=${STORAGE_ENDPOINT}
storage.region=${STORAGE_REGION:auto}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.bucket=${STORAGE_BUCKET}
storage.create-bucket=${STORAGE_CREATE_BUCKET:false}

# 웹 푸시(VAPID). 공개 키는 브라우저가 구독할 때 필요해 화면에 내려가고, 개인 키는 서명에만 쓴다.
app.push.vapid.public-key=${VAPID_PUBLIC_KEY}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY}
app.push.vapid.subject=${VAPID_SUBJECT}

# 첫 관리자. 이 이메일의 계정을 기동 시와 가입 시에 관리자로 올린다. 비어 있으면 아무도 올리지 않는다.
app.admin.email=${ADMIN_EMAIL:}

# 메일 발송(결정-0011). 호스트와 포트는 환경을 타지 않아 여기 둔다.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:no-reply@gentask.xyz}
app.mail.from-name=${MAIL_FROM_NAME:Gentask}

# 일회용 코드(결정-0012). 정책값이라 환경을 타지 않는다. 여섯 자리 · 10분 · 다섯 번.
app.credential.code-length=${CREDENTIAL_CODE_LENGTH:6}
app.credential.code-ttl=${CREDENTIAL_CODE_TTL:PT10M}
app.credential.max-attempts=${CREDENTIAL_MAX_ATTEMPTS:5}
