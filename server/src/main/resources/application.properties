spring.application.name=refarch

# 자격증명을 평문으로 두지 않는다. 기본값은 compose.yaml 의 로컬 컨테이너와 맞춘 것이며
# 그 밖의 환경은 환경변수로 주입한다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/refarch}
spring.datasource.username=${DB_USERNAME:refarch}
spring.datasource.password=${DB_PASSWORD:refarch}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 세션과 토큰 해시의 키. 로컬 기본값이며 배포에서는 환경변수로 주입한다. 32자 미만이면 기동이 실패한다.
auth.secret=${AUTH_SECRET:local-dev-secret-at-least-32-characters-long}
auth.session.ttl=P30D
auth.session.absolute-ttl=P90D
auth.session.touch-interval=PT1H
auth.session.cookie-name=session_token
# 로컬은 http 라 Secure 쿠키가 실리지 않는다. 배포에서 true 로 주입한다.
auth.session.cookie-secure=${AUTH_COOKIE_SECURE:false}

# 파일 보관소. 기본값은 compose.yaml 의 MinIO 이고, R2 로 갈 때는 이 넷을 환경변수로 바꾼다.
# 브라우저가 presigned URL 로 직접 접근하므로 endpoint 는 브라우저에서 닿는 주소여야 한다.
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.region=${STORAGE_REGION:auto}
storage.access-key=${STORAGE_ACCESS_KEY:refarch}
storage.secret-key=${STORAGE_SECRET_KEY:refarch-minio}
storage.bucket=${STORAGE_BUCKET:refarch}
# MinIO 는 버킷을 만들어 주지 않아 기동 때 시도한다. R2 는 버킷을 미리 파고 false 로 둔다.
storage.create-bucket=${STORAGE_CREATE_BUCKET:true}

# 웹 푸시(VAPID). 공개 키는 브라우저가 구독할 때 필요해 화면에 내려가고, 개인 키는 서명에만 쓴다.
# 기본값은 로컬 전용으로 만든 쌍이며 배포에서는 환경변수로 주입한다. 값이 비면 알림 경로가
# 503 으로 응답하고 그 밖의 기능은 그대로 동작한다.
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:BDVInzI3Fpxe8dhLpt2Y49GVdQUWpYqyYA0Oi0J7_6o7u64qCKnAZ4b_27hPc1zQEbovShJCjNGQKIK6j8X988g}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:DT2SYIPLJ0SW7xAucq2U9N5nqXJQe7EqnbdG_J4OKuM}
app.push.vapid.subject=${VAPID_SUBJECT:mailto:dev@todogen.app}

# 첫 관리자. 이 이메일의 계정을 기동 시와 가입 시에 관리자로 올린다. 비어 있으면 아무도 올리지 않는다.
app.admin.email=${ADMIN_EMAIL:}

# 메일 발송(결정-0011). Gmail 의 SMTP 이며 자격은 계정 비밀번호가 아니라 앱 비밀번호다.
# 비어 있으면 기동은 되고 발송하는 자리에서만 실패한다 — 가입과 재설정이 거기서 멈춘다.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:no-reply@todogen.app}
app.mail.from-name=${MAIL_FROM_NAME:Todogen}

# 일회용 코드(결정-0012). 여섯 자리 · 10분 · 다섯 번.
app.credential.code-length=${CREDENTIAL_CODE_LENGTH:6}
app.credential.code-ttl=${CREDENTIAL_CODE_TTL:PT10M}
app.credential.max-attempts=${CREDENTIAL_MAX_ATTEMPTS:5}
