spring.application.name=devkit

# 자격증명은 평문으로 두지 않는다 — 환경변수로 주입한다 (설계/인프라.md §4)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devkit}
spring.datasource.username=${DB_USERNAME:devkit}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# 인증 (결정-0014·0015, 설계/서버.md §1.5·§1.6)
# 시크릿은 환경변수로 주입한다 — 기본값은 로컬 개발 전용이며 배포 환경에서는 반드시 덮어쓴다
auth.secret=${AUTH_SECRET:local-dev-secret-change-me}
auth.session.ttl=P30D
auth.session.touch-interval=PT1H
auth.session.cookie-name=session_token
auth.session.cookie-secure=${AUTH_COOKIE_SECURE:true}
# OTP 발송 rate limit — IP는 촘촘히, 이메일은 넉넉히 (결정-0015 §결정 3)
auth.otp.ip-limit=10
auth.otp.ip-window=PT10M
auth.otp.email-limit=10
auth.otp.email-window=PT1H

# 메일 발송 — Gmail SMTP, 자격증명은 환경변수 (결정-0016)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Gmail SMTP는 발신자가 계정 주소로 고정된다 (결정-0016 §결과)
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
