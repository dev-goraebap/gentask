spring.application.name=refarch

# 자격증명을 평문으로 두지 않는다. 기본값은 compose.yaml 의 로컬 컨테이너와 맞춘 것이며
# 그 밖의 환경은 환경변수로 주입한다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/refarch}
spring.datasource.username=${DB_USERNAME:refarch}
spring.datasource.password=${DB_PASSWORD:refarch}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 세션과 토큰 해시의 키. 로컬 기본값이며 배포에서는 환경변수로 주입한다. 32자 미만이면 기동이 실패한다.
auth.secret=${AUTH_SECRET:local-dev-secret-at-least-32-characters-long}
auth.session.ttl=P30D
auth.session.absolute-ttl=P90D
auth.session.touch-interval=PT1H
auth.session.cookie-name=session_token
# 로컬은 http 라 Secure 쿠키가 실리지 않는다. 배포에서 true 로 주입한다.
auth.session.cookie-secure=${AUTH_COOKIE_SECURE:false}

# 파일 보관소. 기본값은 compose.yaml 의 MinIO 이고, R2 로 갈 때는 이 넷을 환경변수로 바꾼다.
# 브라우저가 presigned URL 로 직접 접근하므로 endpoint 는 브라우저에서 닿는 주소여야 한다.
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.region=${STORAGE_REGION:auto}
storage.access-key=${STORAGE_ACCESS_KEY:refarch}
storage.secret-key=${STORAGE_SECRET_KEY:refarch-minio}
storage.bucket=${STORAGE_BUCKET:refarch}
# MinIO 는 버킷을 만들어 주지 않아 기동 때 시도한다. R2 는 버킷을 미리 파고 false 로 둔다.
storage.create-bucket=${STORAGE_CREATE_BUCKET:true}
