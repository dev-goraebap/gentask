spring.application.name=devkit

# 자격증명은 평문으로 두지 않는다 — 환경변수로 주입한다 (설계/인프라.md §4)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devkit}
spring.datasource.username=${DB_USERNAME:devkit}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
# 상세는 관리자만 본다 — 인증 필터가 모든 로그인 사용자에게 ROLE_USER를 주므로
# when-authorized만으로는 일반 사용자에게 DB·메일 컴포넌트 상태가 노출된다
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# 리버스 프록시 뒤에 배포한다 (설계/인프라.md §2) — X-Forwarded-* 를 반영하지 않으면
# 클라이언트 IP가 전부 프록시 IP가 되어 rate limit이 전역 카운터로 붕괴한다.
#
# NATIVE(Tomcat RemoteIpValve)를 쓰는 이유: XFF를 오른쪽에서 왼쪽으로 훑으며 신뢰 프록시를
# 건너뛴다. Spring의 FRAMEWORK 필터는 XFF의 '첫' 항목을 채택하는데, nginx의 표준 레시피
# ($proxy_add_x_forwarded_for)는 클라이언트가 보낸 값을 앞에 두고 덧붙이므로 첫 항목이
# 클라이언트 통제 값이 된다 — 헤더 한 줄로 IP 기반 제한을 전부 우회할 수 있다.
#
# internal-proxies에 실제 프록시 대역을 반드시 넣어라. 기본값은 사설 대역이며,
# 프록시가 그 밖에 있으면 클라이언트 IP를 신뢰 프록시로 오인한다.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NATIVE}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|::1|0:0:0:0:0:0:0:1}

# 인증 (결정-0014·0015, 설계/서버.md §1.5·§1.6)
# 시크릿에 기본값을 두지 않는다 — 주입이 없으면 기동에 실패한다 (설계/서버.md §8).
# 로컬 개발은 application-local.properties 또는 환경변수로 준다.
auth.secret=${AUTH_SECRET}
auth.session.ttl=P30D
# 슬라이딩 연장의 상한 — 계속 쓰이는 세션도 이 시점에는 반드시 만료된다
auth.session.absolute-ttl=P90D
auth.session.touch-interval=PT1H
auth.session.cookie-name=session_token
auth.session.cookie-secure=${AUTH_COOKIE_SECURE:true}
# 쿠키 세션의 허용 출처. 비우면 요청 자신의 출처와 비교한다(같은 오리진 배포 전제).
# 프록시 뒤에서는 공개 오리진을 명시하는 편이 안전하다. 와일드카드는 CSRF 방어를 무력화한다.
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:}

# OTP rate limit — IP는 촘촘히, 이메일은 넉넉히 (결정-0015 §결정 3).
# 이 대소 관계를 뒤집지 마라: 이메일별을 조이면 공격자가 남의 주소로 한도를 소진시켜
# 정상 가입과 재발송을 막는 서비스 거부가 된다.
auth.otp.issue-ip-limit=5
auth.otp.issue-ip-window=PT10M
auth.otp.issue-email-limit=30
auth.otp.issue-email-window=PT1H
# 확인(대입) 요청 제한 — 레코드당 5회 제한만으로는 레코드를 갈아치우는 대입을 막지 못한다
auth.otp.confirm-ip-limit=20
auth.otp.confirm-ip-window=PT10M

# 로그인 시도 제한 — 크리덴셜 스터핑과 bcrypt CPU 고갈을 함께 막는다
auth.login.ip-limit=20
auth.login.ip-window=PT10M
auth.login.account-limit=10
auth.login.account-window=PT10M

# 메일 발송 — Gmail SMTP, 자격증명은 환경변수 (결정-0016)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Gmail SMTP는 발신자가 계정 주소로 고정된다 (결정-0016 §결과)
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# 소셜 로그인 (AUTH-02·03, 결정-0015)
#
# 콜백 경로가 Spring Security 기본값(/login/oauth2/code/*)이 아닌 이유:
# 제공자 콘솔에 등록된 주소가 프론트(4200)이고, dev-server 프록시가 이 경로를 서버로 넘겨야 한다.
# 그 프록시는 아직 없다 — 이슈 #42에서 배선한다(설계/인프라.md §2).
# 프로덕션은 web·server가 한 오리진이라(설계/인프라.md §2) 같은 경로가 그대로 동작한다.
#
# 이메일 scope를 요구하지 않는다 — 제공자가 주는 이메일을 신뢰하지 않기 때문이다(결정-0015).
# 제공자는 "이 사람이 그 제공자의 그 계정 주인이다"만 증명하고, 이메일 소유는 우리 OTP가 증명한다.
# 키를 넣지 않으면 자리표시자로 기동한다 — 소셜 버튼을 노출하지 않으면 그만이고,
# 키트를 복제한 사람이 소셜 없이도 바로 실행할 수 있어야 하기 때문이다(결정-0016과 같은 기준).
auth.oauth.redirect-base=${OAUTH_REDIRECT_BASE:http://localhost:4200}

# 로그인 시작 경로의 IP당 한도 (보안 검토 F3). 사람이 버튼을 누르는 빈도에는 걸리지 않는다.
auth.oauth.start-ip-limit=20
auth.oauth.start-ip-window=10m

# oauth2Login은 인가 요청의 state와 PKCE code_verifier를 서블릿 세션에 보관한다. 우리 로그인 세션은
# DB에 있고(결정-0014) 이 세션은 오직 제공자에 다녀오는 왕복 동안만 필요하므로, 수명을 그 왕복
# 시간까지만 남긴다 — 길게 두면 쌓인 세션이 힙에 남는다.
#
# 주의: 이 세션 때문에 소셜 로그인 경로는 완전한 무상태가 아니다. 인스턴스를 여러 대로 늘릴 때
# 스티키 세션이 없으면 콜백이 다른 인스턴스에 도착해 state 조회가 실패한다 (설계/인프라.md §2).
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=profile
spring.security.oauth2.client.registration.google.redirect-uri=${auth.oauth.redirect-base}/auth/callback/google

# 카카오는 Spring Security 기본 제공자 목록에 없어 엔드포인트를 직접 적는다.
# client-id에는 REST API 키를 넣는다.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri=${auth.oauth.redirect-base}/auth/callback/kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
