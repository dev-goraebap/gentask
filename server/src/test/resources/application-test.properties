# 테스트 전용 설정. 프로덕션 설정(src/main/resources/application.properties)을 덮어쓴다.
#
# auth.secret은 기본값이 없어(주입 없으면 기동 실패) 테스트에서도 명시해야 한다 —
# 이 값이 여기 있는 것 자체가 "저장소에 프로덕션 시크릿을 두지 않는다"는 규칙과 어긋나지 않는다.
# 테스트 컨테이너는 매번 폐기되고 이 값으로 보호되는 자산이 없다.
auth.secret=test-only-secret-not-used-in-any-deployment

# 메일은 통합 테스트에서 가짜 MailSender로 대체된다 — SMTP 연결이 일어나지 않는다
spring.mail.host=localhost
spring.mail.port=3025
mail.from=devkit-test@example.com

# 정리 스케줄러는 테스트 시각을 통제하는 흐름과 무관하다
spring.task.scheduling.pool.size=1

# 소셜 로그인 — 실제 제공자를 부르지 않는다. 통합 테스트는 성공 핸들러를 직접 호출한다
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-secret
