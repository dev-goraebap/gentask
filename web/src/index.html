<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Web</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* 번들이 부팅하기 전까지 보이는 화면. 스타일시트(195 kB)보다 먼저 도착해야
         하므로 인라인이며, 토큰 대신 배경색 두 벌을 직접 갖는다. */
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; background: #fefefe; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #26262b; }
      }
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-boot span {
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid rgba(128, 128, 132, 0.25);
        border-top-color: rgba(128, 128, 132, 0.75);
        border-radius: 50%;
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-boot span { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-boot" role="status" aria-label="불러오는 중"><span></span></div>
    </app-root>
  </body>
</html>
