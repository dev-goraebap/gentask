<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      다크 모드 결정 — 첫 페인트 전에 끝나야 한다 (결정-0024).

      Krill 토큰은 `.dark` 클래스만 본다. 그 클래스를 붙이는 주체가 없으면 OS를
      다크로 설정한 사용자도 라이트 화면을 받는다. 앱 코드에서 붙이면 Angular가
      뜬 뒤라서 라이트로 한 번 그렸다가 어두워지는 깜빡임이 생긴다 — 그래서
      번들보다 먼저 실행되는 인라인 스크립트로 둔다.

      localStorage가 OS 선호를 이긴다. 사용자가 직접 고른 것이 시스템 설정보다
      뒤에 온 의사 표시이기 때문이다. 저장된 값이 없을 때만 OS를 따른다.
      토글 UI는 아직 없다 — 값을 쓰는 쪽이 생기면 이 규칙이 그대로 맞물린다.

      color-scheme도 함께 맞춘다. 스크롤바·기본 폼 컨트롤처럼 브라우저가 직접
      그리는 것들이 이 값을 보고 자기 색을 정한다.
    -->
    <script>
      (function () {
        try {
          var 저장값 = localStorage.getItem('theme');
          var 다크 =
            저장값 === 'dark' ||
            (저장값 === null && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', 다크);
          document.documentElement.style.colorScheme = 다크 ? 'dark' : 'light';
        } catch (e) {
          /* localStorage가 막힌 환경(사생활 보호 모드 등)에서는 라이트로 둔다 */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
