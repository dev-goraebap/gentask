<section class="mx-auto w-full max-w-[40rem] px-4 py-8 md:py-12">
  @if (task(); as current) {
    <nav class="mb-6">
      <a hlmBtn variant="ghost" size="sm" [routerLink]="routes.taskList()">목록으로</a>
    </nav>

    <!-- novalidate 가 없으면 브라우저 기본 검증이 제출을 가로챕니다. 12-forms.md 1절. -->
    <form novalidate [formRoot]="editForm" (submit)="save($event)" class="flex flex-col gap-6">
      <!--
        필드 래퍼가 레이블 연결과 오류 표시 자리를 제공합니다. 날것의 div 로 조립하면
        그 배선을 매번 직접 해야 합니다. 12-forms.md 7.1절.
      -->
      <div hlmField>
        <label hlmFieldLabel for="task-title">제목</label>
        <input hlmInput id="task-title" [formField]="editForm.title" autocomplete="off" />
        @for (error of editForm.title().errors(); track error.kind) {
          <!--
            forceShow 를 넘기는 이유는 이 컴포넌트가 부모 필드의 NgControl 로 표시 조건을
            판정하는데 Signal Forms 에는 그것이 없어 조건이 서지 않기 때문입니다.
            표시 여부는 화면이 정하고 접근성 배선만 빌려 씁니다. 12-forms.md 7.1절.
          -->
          <hlm-field-error forceShow>{{ error.message }}</hlm-field-error>
        }
      </div>

      <div hlmField>
        <label hlmFieldLabel for="task-due">마감일</label>
        <div class="flex items-center gap-2">
          <!--
            네이티브 날짜 입력을 쓰지 않습니다. OS 와 브라우저마다 외형이 달라져 화면
            통제를 잃기 때문이며, 접근성 부담은 brain 이 제공하는 프리미티브가 흡수합니다.
            07-adaptive-ui.md 4.1절.
          -->
          <hlm-date-picker [date]="dueDate()" (dateChange)="setDueDate($event)">
            <!-- 레이블이 가리킬 id 를 지정합니다. 지정하지 않으면 생성기가 붙인 일련번호가 됩니다. -->
            <hlm-date-picker-trigger buttonId="task-due" class="w-48">
              정하지 않음
            </hlm-date-picker-trigger>
          </hlm-date-picker>

          @if (draftDueDate()) {
            <!-- 한 번 정한 마감일을 되돌릴 길이 없으면 정하는 것 자체가 부담이 됩니다. -->
            <button hlmBtn type="button" variant="ghost" size="sm" (click)="setDueDate(null)">
              지우기
            </button>
          }
        </div>
      </div>

      <div hlmField>
        <label hlmFieldLabel for="task-note">메모</label>
        <textarea
          hlmTextarea
          id="task-note"
          rows="6"
          [formField]="editForm.note"
          placeholder="맥락이나 준비물을 적어 두세요"
        ></textarea>
      </div>

      <div class="flex items-center gap-2">
        <button hlmBtn type="submit">저장</button>
        <a hlmBtn variant="ghost" [routerLink]="routes.taskList()">취소</a>
      </div>
    </form>
  } @else {
    <p class="text-foreground-secondary py-12 text-center text-sm">
      찾을 수 없는 할 일입니다.
      <a class="text-primary underline-offset-4 hover:underline" [routerLink]="routes.taskList()">
        목록으로 돌아가기
      </a>
    </p>
  }
</section>
