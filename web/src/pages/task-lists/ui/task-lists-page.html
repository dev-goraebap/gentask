<section class="flex flex-1 flex-col px-2 py-3">
  <h1 class="px-2 py-1 text-2xl font-semibold tracking-tight">할 일</h1>

  <ul class="mt-2 flex flex-col gap-1">
    @for (view of views; track view.value) {
      <li>
        <a
          [routerLink]="routes.taskList(view.value)"
          class="text-foreground hover:bg-muted flex min-h-12 items-center gap-3 rounded-(--radius-nav) px-3"
        >
          <app-icon [name]="view.icon" class="text-foreground-secondary" />
          <span class="flex-1 text-base">{{ view.label }}</span>
          <app-icon name="hgiArrowRight" class="text-foreground-secondary" />
        </a>
      </li>
    }
  </ul>

  <p class="text-foreground-secondary px-3 pt-5 pb-1 text-xs font-medium">더보기</p>
  <ul class="flex flex-col gap-1">
    @for (item of moreItems; track item.link) {
      <li>
        <a
          [routerLink]="item.link"
          class="text-foreground hover:bg-muted flex min-h-12 items-center gap-3 rounded-(--radius-nav) px-3"
        >
          <app-icon [name]="item.icon" class="text-foreground-secondary" />
          <span class="flex-1 text-base">{{ item.label }}</span>
          <app-icon name="hgiArrowRight" class="text-foreground-secondary" />
        </a>
      </li>
    }
  </ul>

  <!-- 좁은 화면에는 사이드바가 없다. 그 아래에 있던 자리들을 여기서 잇는다. -->
  @if (me(); as user) {
    <div class="border-border mt-auto flex flex-col gap-1 border-t pt-2">
      @if (user.role === 'ADMIN') {
        <a
          [routerLink]="routes.adminUsers()"
          class="text-foreground-secondary hover:bg-muted hover:text-foreground flex min-h-12 items-center gap-3 rounded-(--radius-nav) px-3"
        >
          <app-icon name="hgiShield" />
          <span class="flex-1 text-sm">관리자 페이지</span>
        </a>
      }
      <a
        [routerLink]="routes.account()"
        class="text-foreground-secondary hover:bg-muted hover:text-foreground flex min-h-12 items-center gap-3 rounded-(--radius-nav) px-3"
      >
        <app-user-avatar class="size-7 text-xs" [name]="user.nickname" [imageUrl]="user.profileImageUrl" />
        <span class="min-w-0 flex-1 truncate text-sm">{{ user.nickname }}</span>
      </a>
    </div>
  }
</section>
