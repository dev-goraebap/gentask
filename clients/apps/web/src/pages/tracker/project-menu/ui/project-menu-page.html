<section class="flex flex-1 flex-col px-2 py-3">
  <h1 class="px-2 py-1 text-2xl font-semibold tracking-tight">{{ project().name }}</h1>
  <p class="text-foreground-secondary px-2 text-sm">
    작업 아이템 {{ project().issueCount }} · 문서 {{ project().docCount }}
  </p>

  @for (group of groups(); track $index) {
    @if (group.label; as label) {
      <p class="text-foreground-secondary px-3 pt-5 pb-1 text-xs font-medium">{{ label }}</p>
    }

    <ul class="mt-2 flex flex-col gap-1 first:mt-2">
      @for (item of group.items; track item.link) {
        <li>
          <a
            [routerLink]="item.link"
            class="text-foreground hover:bg-muted flex min-h-12 items-center gap-3 rounded-(--radius-nav) px-3"
          >
            <app-icon [name]="item.icon" class="text-foreground-secondary" />
            <span class="flex-1 text-base">{{ item.label }}</span>
            <app-icon name="hgiArrowRight" class="text-foreground-secondary" />
          </a>
        </li>
      }
    </ul>
  }
</section>
