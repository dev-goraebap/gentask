<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Gentask</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      PNG 로 둔다. 지금 브라우저는 모두 이것을 읽으며, ico 는 여러 크기를 한 파일에 담기 위한
      옛 형식이라 우리가 이미 크기별로 나눠 둔 것과 겹친다.
    -->
    <!-- 이름을 그리는 글꼴. 첫 화면에 곧바로 서므로 미리 받는다. -->
    <link
      rel="preload"
      href="fonts/unbounded-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

    <!--
      홈 화면에 설치할 수 있게 만든다. iOS 는 설치된 자리에서만 웹 푸시를 허용하므로
      알림을 받으려면 이것이 있어야 한다. 근거는 NTF-001 의 A5 다.

      apple-touch-icon 은 iOS 가 manifest 의 icons 를 읽지 않아 따로 둔다.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
